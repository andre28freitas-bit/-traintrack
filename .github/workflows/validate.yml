name: Validate TrainTrack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check auth-redirect.js
          node --check app.js
          node --check extensions-core.js
          node --check score-model.js
          node --check extensions-calendar.js
          node --check assessment-edit.js
          node --check templates-progress-v2.js
          node --check score-ui-patch.js
          node --check progress-comparison.js
          node --check summary-delta-ui.js
          node --check print-report.js
          node --check calendar-nav-v2.js
          node --check calendar-event-edit.js
          node --check dashboard-home-ui.js
          node --check sw.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"

      - name: Ensure TrainTrack uses isolated application tables
        shell: bash
        run: |
          if grep -RE "from\('(clients|appointments|salons|salon_members|services|visits|products|stock_movements)'\)" --include='*.js' .; then
            echo "Found a reference to non-TrainTrack application tables"
            exit 1
          fi
          grep -Rq "traintrack_students" --include='*.js' .
          grep -Rq "traintrack_assessments" --include='*.js' .
          grep -Rq "traintrack_workouts" --include='*.js' .
          grep -Rq "traintrack_events" --include='*.js' .
          grep -Rq "traintrack_assessment_templates" --include='*.js' .

      - name: Ensure media storage stays isolated
        shell: bash
        run: |
          grep -q "traintrack-media" extensions-core.js
          if grep -R "oficina-fotos" --include='*.js' .; then
            echo "Found workshop storage reference in TrainTrack"
            exit 1
          fi

      - name: Ensure assessment management is present
        shell: bash
        run: |
          grep -q "ttEditAssessment" assessment-edit.js
          grep -q "ttDeleteAssessment" assessment-edit.js
          grep -q "ttExportReport" assessment-edit.js

      - name: Ensure new UX modules are wired
        shell: bash
        run: |
          grep -q "templates-progress-v2.js" bootstrap.js
          grep -q "calendar-nav-v2.js" bootstrap.js
          grep -q "calendar-event-edit.js" bootstrap.js
          grep -q "dashboard-home-ui.js" bootstrap.js
          grep -q "score-model.js" bootstrap.js
          grep -q "score-ui-patch.js" bootstrap.js
          grep -q "progress-comparison.js" bootstrap.js
          grep -q "summary-delta-ui.js" bootstrap.js
          grep -q "print-report.js" bootstrap.js
          grep -q "ttTemplateModal" templates-progress-v2.js
          grep -q "ttCalNext" calendar-nav-v2.js
          grep -q "ttCalView" calendar-nav-v2.js
          grep -q "ttOpenEvent" calendar-event-edit.js
          grep -q "ttSaveCalendarEventEdit" calendar-event-edit.js
          grep -q "ttDeleteCalendarEvent" calendar-event-edit.js
          grep -q "series_key" calendar-event-edit.js
          grep -q "recurrence_exceptions" calendar-event-edit.js
          grep -q "grid-template-columns:repeat(2" dashboard-home-ui.js
          grep -q "Próximos 30 dias" dashboard-home-ui.js
          grep -q "weightEach: 1 / 3" score-model.js
          grep -q "ttCompareProgress" progress-comparison.js
          grep -q "data-reference" progress-comparison.js
          grep -q "tt-delta-up" summary-delta-ui.js
          grep -q "color:inherit" summary-delta-ui.js
          grep -q "percentText" summary-delta-ui.js
          grep -q "@page{size:A4 landscape" print-report.js
          grep -q "window.print" print-report.js
